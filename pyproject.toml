[project]
name = "findex"
version = "1.0.0"
description = "A typed Python text search engine with Boolean and ranked retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn>=0.30",
]

[project.scripts]
findex = "findex.cli:app"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6.0"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-benchmark>=5.1",
    "psutil>=6,<9",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.170.17",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
markers = ["slow: tests taking more than one second"]
