<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Findex — ranked search over a local text corpus.">
  <title>{% block title %}Findex · Search{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="logo" href="/" aria-label="Findex — головна">
        <span class="logo-symbol">F<span>.</span></span><span class="logo-text">find<span>ex</span></span>
      </a>
      <nav aria-label="Службова навігація">
        <a href="/">Пошук</a>
        <a href="/docs">API Docs</a>
        <a href="/stats">Статистика</a>
        <a href="/health" class="health-link"><span class="status-dot"></span> Система</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer><span>Findex / лабораторна №7</span><span>BM25 · TF-IDF · Boolean search</span></footer>
  </div>
</body>
</html>
