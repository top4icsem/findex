name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies from lock file
        run: uv sync --locked
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Pyright strict
        run: uv run --locked pyright
      - name: Pytest and coverage
        run: uv run --locked pytest -q --cov=findex --cov-report=term-missing

      - name: Lab 08 benchmark results
        run: uv run --locked pytest -q tests/test_lab08_benchmarks.py --benchmark-only --benchmark-json=lab08_benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: lab08-benchmark
          path: lab08_benchmark.json
